{% if messages %}
<div class="px-6 md:px-20 lg:px-40 mt-4">
    {% for message in messages %}
    <div class="p-4 rounded-xl text-sm font-bold {% if message.tags == 'success' %}bg-green-50 text-green-600 border border-green-100{% elif message.tags == 'error' %}bg-red-50 text-red-600 border border-red-100{% else %}bg-primary/5 text-primary border border-primary/10{% endif %} flex justify-between items-center mb-4">
        <span>{{ message }}</span>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 transition-colors">
            <span class="material-symbols-outlined text-sm">close</span>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
