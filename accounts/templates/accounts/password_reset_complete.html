{% extends "base.html" %}
{% block title %}Password Reset Complete | ProBank{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-6 md:px-20 py-12 md:py-20">
    <div class="flex items-center justify-center min-h-[60vh]">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-primary/10">
            <div class="p-8 text-center">
                <div class="size-16 bg-green-100 rounded-full flex items-center justify-center text-green-600 mx-auto mb-4">
                    <span class="material-symbols-outlined text-4xl">check_circle</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-2">Password Reset!</h2>
                <p class="text-slate-500 text-sm mb-8">Your password has been successfully updated. You can now sign in with your new password.</p>

                <a href="{% url 'accounts:login' %}" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl hover:bg-primary/90 transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">login</span>
                    Sign In Now
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
