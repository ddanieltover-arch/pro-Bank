<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Login | ProBank</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e53734",
                        "background-light": "#f8f6f6",
                        "background-dark": "#1a1010",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="flex flex-col items-center gap-4 mb-10">
            <div class="size-16 bg-primary rounded-2xl flex items-center justify-center text-white shadow-2xl shadow-primary/20 rotate-3">
                <span class="material-symbols-outlined text-4xl">account_balance</span>
            </div>
            <div class="text-center">
                <h1 class="text-3xl font-black tracking-tighter uppercase italic">ProBank Admin</h1>
                <p class="text-slate-500 font-bold text-xs uppercase tracking-widest mt-1">Authorized Access Only</p>
            </div>
        </div>

        <!-- Login Form -->
        <div class="bg-white dark:bg-slate-900 p-10 rounded-[40px] border border-primary/10 shadow-2xl shadow-slate-200/50 dark:shadow-none relative overflow-hidden">
            <!-- Decorative Gradients -->
            <div class="absolute -top-24 -right-24 size-48 bg-primary/5 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -left-24 size-48 bg-blue-500/5 rounded-full blur-3xl"></div>

            {% include "core/includes/messages.html" %}

            <form method="POST" class="space-y-6 relative z-10">
                {% csrf_token %}
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest px-1">Staff Username</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">person</span>
                        <input name="username" type="text" class="w-full h-14 pl-12 pr-6 rounded-2xl bg-slate-50 dark:bg-primary/5 border border-primary/10 focus:ring-4 focus:ring-primary/10 focus:border-primary font-bold text-sm outline-none transition-all" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest px-1">Secure Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">lock</span>
                        <input name="password" type="password" class="w-full h-14 pl-12 pr-6 rounded-2xl bg-slate-50 dark:bg-primary/5 border border-primary/10 focus:ring-4 focus:ring-primary/10 focus:border-primary font-bold text-sm outline-none transition-all" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full h-16 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-2xl hover:opacity-90 transition-all flex items-center justify-center gap-3">
                    <span class="material-symbols-outlined text-[18px]">verified_user</span>
                    Internal Access
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
            &copy; 2026 ProBank Systems &bull; Administrative Portal
        </p>
    </div>
</body>
</html>
