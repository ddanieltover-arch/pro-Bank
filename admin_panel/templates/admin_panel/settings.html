{% extends "admin_panel/base_admin.html" %}
{% block title %}System Settings | ProBank Admin{% endblock %}

{% block admin_content %}
<header class="mb-8">
    <h1 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">System Settings</h1>
    <p class="text-slate-500 mt-1">Manage platform configurations and security protocols.</p>
</header>

<div class="space-y-8">
    <section class="bg-white dark:bg-slate-900 rounded-xl border border-primary/5 shadow-sm p-6">
        <h2 class="text-lg font-bold mb-4">General Settings</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Site Name</label>
                <input class="w-full rounded-lg border-primary/20 bg-slate-50 text-sm p-3" type="text" value="ProBank Global Terminal"/>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Support Email</label>
                <input class="w-full rounded-lg border-primary/20 bg-slate-50 text-sm p-3" type="email" value="ops@probank.com"/>
            </div>
        </div>
    </section>
</div>
{% endblock %}
